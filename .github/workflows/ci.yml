name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  test:
    name: core (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.12']
        include:
          - os: ubuntu-latest
            python-version: '3.9'
          - os: windows-latest
            python-version: '3.9'
          - os: macos-15-intel
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install core and development dependencies
        run: python -m pip install '.[dev]'
      - name: Lint for syntax and undefined names
        run: ruff check .
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Platform diagnostics
        run: imf doctor --json
      - name: Reproducible synthetic example
        run: python examples/synthetic/run_demo.py --output demo-output
      - name: Build source and wheel distributions
        run: python -m build
      - name: Verify wheel installation outside source checkout
        run: python tests/smoke_wheel.py 'dist/*.whl'
      - name: Save distributions
        uses: actions/upload-artifact@v4
        with:
          name: distributions-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/*
